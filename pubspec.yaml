name: prompthub
description: PromptVault AI — an interactive visual prompt library.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  supabase_flutter: ^2.18.3
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^4.0.4
  flutter_cache_manager: ^3.4.5
  flutter_blurhash: ^0.9.1
  url_launcher: ^6.3.3
  purchases_flutter: ^10.15.2
  google_fonts: ^9.0.0
  material_ui: ^1.7.0
  share_plus: ^13.3.1
  image_picker: ^1.2.4
  image: ^4.12.0
  onesignal_flutter: 5.5.2 # onesignal:managed v1 — stable release feed
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: '>=2.10.0 <2.17.1'
